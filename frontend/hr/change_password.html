<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - AI HR Assistant HR Portal</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        .module-section {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Change Password Page Layout */
        .page-header-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .page-header-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .password-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
<script>/* instant theme restore */(function(){var t=localStorage.getItem('hr_app_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                
                <div>
                    <div class="logo-text">AI HR Assistant</div>
                    <div class="logo-sub">HR Portal</div>
                </div>
            </div>

            <div class="nav-section-label">Main Menu</div>
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
                Dashboard
            </a>
            <a href="jobs.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-briefcase"></i></span>
                Job Vacancy
            </a>
            <a href="upload_resumes.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-file-arrow-up"></i></span>
                Upload Resumes
            </a>
            <a href="all_candidates.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
                Candidates
            </a>
            <a href="screening.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-clipboard-check"></i></span>
                Screening
            </a>
        <a href="interviewers.html" class="nav-item">
            <span class="nav-icon"><i class="fa-solid fa-user-tie"></i></span>
            Interviewers
        </a>
            <a href="comparison.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-code-compare"></i></span>
                Candidate Comparison
            </a>
            <a href="emails.html" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-paper-plane"></i></span>
                Mailing
            </a>

            <!-- Sidebar Footer User Chip & Menu -->
            <div class="sidebar-footer" style="position: relative;">
                <!-- Popover Menu (Profile, Change Password & Logout) -->
                <div class="user-menu-popover hidden" id="user-menu-popover">
                    <a href="profile.html" class="popover-item">
                        <i class="fa-solid fa-user" style="color: #3b82f6;"></i> Profile
                    </a>
                    <div class="popover-divider"></div>
                    <a href="change_password.html" class="popover-item">
                        <i class="fa-solid fa-lock" style="color: #3b82f6;"></i> Change Password
                    </a>
                    <div class="popover-divider"></div>
                    <a href="#" class="popover-item" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i> Logout
                    </a>
                </div>

                <!-- User Chip -->
                <div class="user-chip" id="user-chip" onclick="toggleUserMenu(event)">
                    <div class="user-avatar" id="sidebar-avatar">H</div>
                    <div class="user-info">
                        <div class="user-name" id="sidebar-name">HR User</div>
                        <div class="user-role" id="sidebar-org">HR Manager</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-title">Change Password</div>
                <button class="theme-toggle-btn" onclick="toggleTheme()" data-tooltip="Switch to Light Mode" aria-label="Toggle theme" id="theme-toggle-btn"><i class="fa-solid fa-moon icon-dark"></i><i class="fa-solid fa-sun icon-light"></i></button>
            </header>

            <div class="page-content scrollable">

                <!-- CHANGE PASSWORD MODULE -->
                    <div class="password-card">
                        <form id="change-password-form" onsubmit="handleChangePassword(event)">
                            <div class="password-grid-3">
                                <!-- Old Password -->
                                <div class="form-group-custom">
                                    <label class="label-custom" for="old-password">Old Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="old-password" class="input-custom" placeholder="Enter old password" required />
                                        <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('old-password', this)" title="Toggle password visibility">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- New Password -->
                                <div class="form-group-custom">
                                    <label class="label-custom" for="new-password">New Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="new-password" class="input-custom" placeholder="Enter new password" required minlength="6" />
                                        <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('new-password', this)" title="Toggle password visibility">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="form-group-custom">
                                    <label class="label-custom" for="confirm-password">Confirm Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="confirm-password" class="input-custom" placeholder="Enter confirm password" required minlength="6" />
                                        <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('confirm-password', this)" title="Toggle password visibility">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div style="display: flex; justify-content: flex-end;">
                                <button type="submit" class="btn-save-password" id="save-password-btn">Save Password</button>
                            </div>
                        </form>
                    </div>

            </div>
        </main>
    </div>

    <!-- Logout Confirmation Modal -->
    <div class="modal-overlay" id="logout-confirm-modal">
        <div class="modal-card" style="max-width: 400px; text-align: center; padding: 32px 24px; background: #0f172a; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); color: #818cf8; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 16px;">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h3 style="font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 8px;">Confirm Logout</h3>
            <p style="font-size: 0.88rem; color: rgba(255, 255, 255, 0.65); margin-bottom: 24px; line-height: 1.5;">Are you sure you want to log out of AI HR Assistant?</p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button type="button" onclick="closeLogoutModal()" style="padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem;">Cancel</button>
                <button type="button" onclick="confirmLogoutAction()" style="padding: 10px 22px; border-radius: 10px; border: none; background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; cursor: pointer; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);">Logout</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="../js/config.js?v=1"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/hr_common.js"></script>
    <script src="../js/hr_change_password.js"></script>
</body>

</html>
