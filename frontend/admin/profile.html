<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - AI HR Assistant Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <style>
        /* Modern Clean Admin Dashboard Aesthetics */
        .module-section {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-upload-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .img-thumb-wrap {
            position: relative;
            width: 64px;
            height: 64px;
        }

        .img-thumb-wrap img,
        .img-thumb-wrap .thumb-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .thumb-close-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            border: none;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-hint-text {
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .change-img-link {
            color: #f97316;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 4px;
        }

        .change-img-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div>
                    <div class="logo-text">AI HR Assistant</div>
                    <div class="logo-sub">Admin Portal</div>
                </div>
            </div>

            <div class="nav-section-label">Main Menu</div>
            <a href="dashboard.html" class="nav-item" id="nav-dashboard">
                <span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
                Dashboard
            </a>
            <a href="organization.html" class="nav-item" id="nav-org">
                <span class="nav-icon"><i class="fa-solid fa-building"></i></span>
                Organization
            </a>
            <a href="branch.html" class="nav-item" id="nav-branch">
                <span class="nav-icon"><i class="fa-solid fa-code-branch"></i></span>
                Branch
            </a>
            <a href="departments.html" class="nav-item" id="nav-dept">
                <span class="nav-icon"><i class="fa-solid fa-sitemap"></i></span>
                Departments
            </a>
            <a href="hr.html" class="nav-item" id="nav-hr">
                <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
                HR
            </a>

            <!-- Sidebar Footer User Chip & Menu -->
            <div class="sidebar-footer" style="position: relative;">
                <!-- Popover Menu (Profile, Change Password & Logout) -->
                <div class="user-menu-popover hidden" id="user-menu-popover">
                    <a href="profile.html" class="popover-item">
                        <i class="fa-solid fa-user" style="color: #3b82f6;"></i> Profile
                    </a>
                    <div class="popover-divider"></div>
                    <a href="change_password.html" class="popover-item">
                        <i class="fa-solid fa-lock" style="color: #3b82f6;"></i> Change Password
                    </a>
                    <div class="popover-divider"></div>
                    <a href="#" class="popover-item" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i> Logout
                    </a>
                </div>

                <!-- User Chip -->
                <div class="user-chip" id="user-chip" onclick="toggleUserMenu(event)">
                    <div class="user-avatar" id="sidebar-avatar">AD</div>
                    <div class="user-info">
                        <div class="user-name" id="sidebar-name">Admin</div>
                        <div class="user-role" id="sidebar-role">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-title" id="page-title">Profile</div>
            </header>

            <div class="page-content scrollable">

                <!-- 1. PROFILE MODULE -->
                    <div class="profile-grid">
                        <!-- Left Column: Avatar & Details -->
                        <div class="profile-left-card">
                            <div class="profile-avatar-large" id="profile-avatar-large">AD</div>
                            <div class="profile-card-name" id="profile-card-name">Admin</div>
                            <div class="profile-card-email" id="profile-card-email">admin@example.com</div>
                        </div>

                        <!-- Right Column: Edit Form -->
                        <div class="profile-right-card">
                            <form id="profile-form" onsubmit="handleSaveProfile(event)">
                                <div class="section-subtitle">Personal Details</div>

                                <!-- Circular Logo Uploader at Top Center -->
                                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 28px;">
                                    <div class="profile-circle-uploader" onclick="document.getElementById('profile-img-file').click()" title="Click to upload profile photo" style="width: 90px; height: 90px; border-radius: 50%; background: rgba(249, 115, 22, 0.15); border: 2px dashed rgba(249, 115, 22, 0.4); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #f97316; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;" id="profile-circle-preview">
                                        <i class="fa-solid fa-camera"></i>
                                    </div>
                                    <span style="font-size: 0.8rem; color: rgba(255, 255, 255, 0.55); margin-top: 10px; font-weight: 500;">Click circle to upload profile photo</span>
                                    <input type="file" id="profile-img-file" accept="image/*" style="display: none;" onchange="onProfileImageFileChange(event)" />
                                </div>

                                <div class="form-grid-2">
                                    <div class="form-group-custom">
                                        <label class="label-custom">Full Name</label>
                                        <input type="text" class="input-custom" id="profile-full-name" required />
                                    </div>
                                    <div class="form-group-custom">
                                        <label class="label-custom">Username</label>
                                        <input type="text" class="input-custom" id="profile-username" required />
                                    </div>
                                </div>

                                <div class="form-grid-2">
                                    <div class="form-group-custom">
                                        <label class="label-custom">Email Address</label>
                                        <input type="email" class="input-custom" id="profile-email" required />
                                    </div>
                                    <div class="form-group-custom">
                                        <label class="label-custom">Phone Number</label>
                                        <input type="text" class="input-custom" id="profile-phone" placeholder="e.g. 9876543210" maxlength="10" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)" />
                                    </div>
                                </div>

                                <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
                                    <button type="submit" class="btn-save-profile" id="save-profile-btn">Save Changes</button>
                                </div>
                            </form>
                        </div>
                    </div>

            </div>
        </main>
    </div>

    <!-- Logout Confirmation Modal -->
    <div class="modal-overlay" id="logout-confirm-modal">
        <div class="modal-card" style="max-width: 400px; text-align: center; padding: 32px 24px; background: #0f172a; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); color: #818cf8; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 16px;">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h3 style="font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 8px;">Confirm Logout</h3>
            <p style="font-size: 0.88rem; color: rgba(255, 255, 255, 0.65); margin-bottom: 24px; line-height: 1.5;">Are you sure you want to log out of AI HR Assistant?</p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button type="button" onclick="closeLogoutModal()" style="padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem;">Cancel</button>
                <button type="button" onclick="confirmLogoutAction()" style="padding: 10px 22px; border-radius: 10px; border: none; background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; cursor: pointer; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);">Logout</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="../js/config.js?v=1"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin/profile.js"></script>
    <script src="../js/admin/common.js"></script>
</body>

</html>
