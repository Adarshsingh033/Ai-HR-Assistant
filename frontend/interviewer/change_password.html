<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password — AI HR Assistant</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        .module-section {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Change Password Page Layout */
        .page-header-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .page-header-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .password-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
<script>/* instant theme restore */(function(){var t=localStorage.getItem('hr_app_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div>
                <div class="logo-text">AI HR Assistant</div>
                <div class="logo-sub">Interviewer Portal</div>
            </div>
        </div>

        <div class="nav-section-label">Main Menu</div>
        <a href="dashboard.html" class="nav-item">
            <span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
            Dashboard
        </a>
        <a href="my_interviewees.html" class="nav-item">
            <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
            My Interviewees
        </a>
        <a href="question_bank.html" class="nav-item">
            <span class="nav-icon"><i class="fa-solid fa-book-open"></i></span>
            Question Bank
        </a>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer" style="position: relative;">
            <div class="user-menu-popover hidden" id="user-menu-popover">
                <a href="change_password.html" class="popover-item">
                    <i class="fa-solid fa-lock" style="color: #3b82f6;"></i> Change Password
                </a>
                <div class="popover-divider"></div>
                <a href="#" class="popover-item" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i> Logout
                </a>
            </div>
            <div class="user-chip" id="user-chip" onclick="toggleUserMenu(event)">
                <div class="user-avatar" id="sidebar-avatar">I</div>
                <div class="user-info">
                    <div class="user-name" id="sidebar-name">Interviewer</div>
                    <div class="user-role" id="sidebar-role">Interviewer</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ── Main Content ── -->
    <main class="main-content">
        <header class="topbar">
            <div class="topbar-title">Change Password</div>
                <button class="theme-toggle-btn" onclick="toggleTheme()" data-tooltip="Switch to Light Mode" aria-label="Toggle theme" id="theme-toggle-btn"><i class="fa-solid fa-moon icon-dark"></i><i class="fa-solid fa-sun icon-light"></i></button>
            </header>

        <div class="page-content scrollable">
            <div class="password-card">
                <form id="change-password-form" onsubmit="handleChangePassword(event)">
                    <div class="password-grid-3">
                        <div class="form-group-custom">
                            <label class="label-custom" for="old-password">Old Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="old-password" class="input-custom" placeholder="Enter old password" required />
                                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('old-password', this)" title="Toggle password visibility">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label class="label-custom" for="new-password">New Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="new-password" class="input-custom" placeholder="Enter new password" required minlength="6" />
                                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('new-password', this)" title="Toggle password visibility">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label class="label-custom" for="confirm-password">Confirm New Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirm-password" class="input-custom" placeholder="Enter confirm password" required minlength="6" />
                                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('confirm-password', this)" title="Toggle password visibility">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:flex-end; margin-top: 24px;">
                        <button type="submit" class="btn-save-password" id="save-password-btn">Save Password</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<!-- Logout Modal -->
<div class="modal-overlay" id="logout-confirm-modal">
    <div style="background:#0f172a;border:1px solid rgba(255,255,255,0.12);border-radius:20px;width:min(400px,92vw);padding:32px 24px;text-align:center;">
        <div style="width:54px;height:54px;border-radius:50%;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;display:flex;align-items:center;justify-content:center;font-size:1.35rem;margin:0 auto 16px;">
            <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <h3 style="font-size:1.15rem;font-weight:900;color:#fff;margin-bottom:8px;">Log out?</h3>
        <p style="font-size:0.84rem;color:var(--text-muted);margin-bottom:24px;">You will need to sign back in to access the portal.</p>
        <div style="display:flex;gap:12px;justify-content:center;">
            <button onclick="closeLogoutModal()" style="padding:10px 22px;border-radius:11px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-weight:700;font-size:0.85rem;">Cancel</button>
            <button onclick="confirmLogoutAction()" style="padding:10px 24px;border-radius:11px;border:none;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;cursor:pointer;font-weight:800;font-size:0.85rem;box-shadow:0 4px 15px rgba(239,68,68,0.4);">Logout</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/config.js?v=1"></script>
<script src="../js/utils.js"></script>
<script src="../js/interviewer_common.js"></script>
<script src="../js/interviewer_change_password.js"></script>
</body>
</html>
