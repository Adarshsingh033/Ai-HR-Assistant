<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | AI HR Assistant</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /*
          Filter bar, search bar, table wrapper and cell styling all come from
          css/main.css so this page scales with the rest of the product.
        */
        .audit-table tbody td { color: rgba(255, 255, 255, 0.85); }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div>
                    <div class="logo-text">AI HR Assistant</div>
                    <div class="logo-sub">Super Admin Portal</div>
                </div>
            </div>
            <div class="nav-section-label">Main Menu</div>
            <a href="dashboard.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span>Dashboard</a>
            <a href="plans.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-layer-group"></i></span>Plans</a>
            <a href="admins.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-users-gear"></i></span>Admins</a>
            <a href="audit.html" class="nav-item active"><span class="nav-icon"><i class="fa-solid fa-list-check"></i></span>Audit Logs</a>
            <div class="sidebar-footer" style="position:relative;">
                <div class="user-menu-popover hidden" id="user-menu-popover">
                    <a href="#" class="popover-item logout-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
                <div class="user-chip" id="user-chip" onclick="toggleUserMenu(event)">
                    <div class="user-avatar" id="sidebar-avatar">SA</div>
                    <div class="user-info">
                        <div class="user-name" id="sidebar-username">Super Admin</div>
                        <div class="user-role" id="sidebar-role">Super Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">Audit Logs</div>
            </header>

            <div class="page-content">

                <!-- Filter Bar -->
                <div class="filter-bar">
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search by endpoint path, method, or action..." oninput="onSearchChange()">
                    </div>
                    <select class="filter-select" id="role-filter" onchange="onFilterChange()">
                        <option value="">All Roles</option>
                        <option value="super_admin">Super Admin</option>
                        <option value="admin">Admin</option>
                        <option value="hr">HR Manager</option>
                        <option value="auth">Auth</option>
                        <option value="system">System</option>
                    </select>
                    <select class="filter-select" id="action-filter" onchange="onFilterChange()">
                        <option value="">All Methods / Actions</option>
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                        <option value="CREATED">CREATED</option>
                        <option value="UPDATED">UPDATED</option>
                        <option value="DELETED">DELETED</option>
                    </select>
                    <select class="filter-select" id="resource-filter" onchange="onFilterChange()">
                        <option value="">All Resources</option>
                        <option value="PLAN">Plan</option>
                        <option value="ADMIN">Admin</option>
                        <option value="ORGANIZATION">Organization</option>
                        <option value="BRANCH">Branch</option>
                        <option value="HR_MEMBER">HR Member</option>
                        <option value="JOB">Job</option>
                        <option value="CANDIDATE">Candidate</option>
                        <option value="SCREENING">Screening</option>
                        <option value="EMAIL">Email</option>
                        <option value="AUTH">Auth</option>
                    </select>
                </div>

                <!-- Data Table Wrap -->
                <div id="table-wrap" class="table-wrap">
                    <table class="audit-table">
                        <thead>
                            <tr>
                                <th style="width: 15%;">Timestamp</th>
                                <th style="width: 16%;">Role / Actor</th>
                                <th style="width: 11%;">HTTP Method</th>
                                <th style="width: 16%;">Resource</th>
                                <th style="width: 42%;">API Call &amp; Details</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body">
                            <tr><td colspan="5" style="text-align:center; padding:48px; color:rgba(255,255,255,0.45);">Loading audit logs...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Server-Side Pagination Controls -->
                <div id="pagination-controls"></div>

            </div>
        </main>
    </div>

    <!-- Logout Confirmation Modal -->
    <div class="modal-overlay" id="logout-confirm-modal">
        <div class="modal-card" style="max-width: 400px; text-align: center; padding: 32px 24px; background: #0f172a; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); color: #818cf8; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 16px;">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h3 style="font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 8px;">Confirm Logout</h3>
            <p style="font-size: 0.88rem; color: rgba(255, 255, 255, 0.65); margin-bottom: 24px; line-height: 1.5;">Are you sure you want to log out of AI HR Assistant?</p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button type="button" onclick="closeLogoutModal()" style="padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem;">Cancel</button>
                <button type="button" onclick="confirmLogoutAction()" style="padding: 10px 22px; border-radius: 10px; border: none; background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; cursor: pointer; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);">Logout</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../js/config.js?v=1"></script>
    <script src="../js/utils.js"></script>
    <script src="js/super_admin.js?v=2"></script>
    <script>
        let currentPage = 1;
        let totalPages  = 1;
        let totalItems  = 0;
        let searchTimeout = null;
        let currentLimit = 15;

        function onPageSizeChange(newSize) {
            currentLimit = parseInt(newSize, 10) || 15;
            currentPage = 1;
            fetchLogs();
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages || page === currentPage) return;
            currentPage = page;
            fetchLogs();
        }

        async function fetchLogs() {
            const role     = document.getElementById('role-filter').value;
            const action   = document.getElementById('action-filter').value;
            const resource = document.getElementById('resource-filter').value;
            const search   = document.getElementById('search-input').value.trim();

            let url = `/api/super-admin/audit-logs?page=${currentPage}&limit=${currentLimit}`;
            if (role)     url += `&user_type=${encodeURIComponent(role)}`;
            if (action)   url += `&action=${encodeURIComponent(action)}`;
            if (resource) url += `&resource_type=${encodeURIComponent(resource)}`;
            if (search)   url += `&search=${encodeURIComponent(search)}`;

            try {
                const data = await apiRequest('GET', url);
                totalPages = data.total_pages;
                totalItems = data.total;
                renderPagination();
                renderTable(data.audit_logs);
            } catch (err) { showToast(err.message || 'Failed to load audit logs', 'error'); }
        }

        function onSearchChange() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => { currentPage = 1; fetchLogs(); }, 350);
        }
        function onFilterChange() { currentPage = 1; fetchLogs(); }

        function renderPagination() {
            const container = document.getElementById('pagination-controls');
            container.innerHTML = paginationBarHTML({
                page: currentPage,
                totalPages: totalPages,
                total: totalItems,
                limit: currentLimit,
                onPage: 'goToPage',
                onPageSize: 'onPageSizeChange'
            });
        }

        function roleBadge(type) {
            const role = (type || 'system').toLowerCase();
            if (role === 'super_admin') {
                return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:99px; background:rgba(249,115,22,0.15); color:#fb923c; border:1px solid rgba(249,115,22,0.3); font-weight:800; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;"><i class="fa-solid fa-user-shield" style="font-size:0.72rem;"></i> SUPER ADMIN</span>`;
            }
            if (role === 'admin') {
                return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:99px; background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid rgba(56,189,248,0.3); font-weight:800; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;"><i class="fa-solid fa-user-gear" style="font-size:0.72rem;"></i> ADMIN</span>`;
            }
            if (role === 'hr') {
                return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:99px; background:rgba(236,72,153,0.15); color:#f472b6; border:1px solid rgba(236,72,153,0.3); font-weight:800; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;"><i class="fa-solid fa-user-tie" style="font-size:0.72rem;"></i> HR MANAGER</span>`;
            }
            return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:99px; background:rgba(148,163,184,0.15); color:#cbd5e1; border:1px solid rgba(148,163,184,0.3); font-weight:800; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;"><i class="fa-solid fa-server" style="font-size:0.72rem;"></i> SYSTEM</span>`;
        }

        function actionBadge(action) {
            const act = (action || '').toUpperCase();
            if (act === 'GET') return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:8px; background:rgba(59,130,246,0.15); color:#60a5fa; border:1px solid rgba(59,130,246,0.3); font-weight:800; font-size:0.75rem;"><i class="fa-solid fa-arrow-down-short-wide" style="font-size:9px;"></i> GET</span>`;
            if (act === 'POST' || act.includes('CREATED')) return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:8px; background:rgba(16,185,129,0.15); color:#34d399; border:1px solid rgba(16,185,129,0.3); font-weight:800; font-size:0.75rem;"><i class="fa-solid fa-plus" style="font-size:9px;"></i> ${act}</span>`;
            if (act === 'PUT' || act.includes('UPDATED') || act.includes('STATUS')) return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:8px; background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.3); font-weight:800; font-size:0.75rem;"><i class="fa-solid fa-pen" style="font-size:9px;"></i> ${act}</span>`;
            if (act === 'DELETE' || act.includes('DELETED')) return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:8px; background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); font-weight:800; font-size:0.75rem;"><i class="fa-solid fa-trash" style="font-size:9px;"></i> ${act}</span>`;
            if (act === 'PATCH') return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:8px; background:rgba(168,85,247,0.15); color:#c084fc; border:1px solid rgba(168,85,247,0.3); font-weight:800; font-size:0.75rem;"><i class="fa-solid fa-code-commit" style="font-size:9px;"></i> PATCH</span>`;
            return `<span style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:8px; background:rgba(100,116,139,0.15); color:#94a3b8; border:1px solid rgba(100,116,139,0.3); font-weight:800; font-size:0.75rem;">${act}</span>`;
        }

        function resourceBadge(type) {
            const colors = {
                PLAN:        { bg:'rgba(99,102,241,0.15)',  color:'#a5b4fc', border:'rgba(99,102,241,0.35)', icon:'fa-layer-group' },
                ADMIN:       { bg:'rgba(249,115,22,0.15)',  color:'#fb923c', border:'rgba(249,115,22,0.35)', icon:'fa-user-shield' },
                ORGANIZATION:{ bg:'rgba(16,185,129,0.15)',  color:'#34d399', border:'rgba(16,185,129,0.35)', icon:'fa-building' },
                BRANCH:      { bg:'rgba(56,189,248,0.15)',  color:'#38bdf8', border:'rgba(56,189,248,0.35)', icon:'fa-code-branch' },
                HR_MEMBER:   { bg:'rgba(236,72,153,0.15)',  color:'#f472b6', border:'rgba(236,72,153,0.35)', icon:'fa-user-tie' },
                JOB:         { bg:'rgba(139,92,246,0.15)',  color:'#c084fc', border:'rgba(139,92,246,0.35)', icon:'fa-briefcase' },
                CANDIDATE:   { bg:'rgba(245,158,11,0.15)',  color:'#fbbf24', border:'rgba(245,158,11,0.35)', icon:'fa-users' },
                SCREENING:   { bg:'rgba(20,184,166,0.15)',  color:'#2dd4bf', border:'rgba(20,184,166,0.35)', icon:'fa-clipboard-check' },
                EMAIL:       { bg:'rgba(14,165,233,0.15)',  color:'#38bdf8', border:'rgba(14,165,233,0.35)', icon:'fa-envelope' },
                AUTH:        { bg:'rgba(225,29,72,0.15)',   color:'#fb7185', border:'rgba(225,29,72,0.35)', icon:'fa-lock' }
            };
            const c = colors[type] || { bg:'rgba(100,116,139,0.15)', color:'#94a3b8', border:'rgba(100,116,139,0.35)', icon:'fa-database' };
            return `<span style="display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:99px; font-size:0.75rem; font-weight:800; background:${c.bg}; color:${c.color}; border:1px solid ${c.border};"><i class="fa-solid ${c.icon}"></i> ${type}</span>`;
        }

        function formatAuditDetails(det, log) {
            if (!det) return '<span style="color:rgba(255,255,255,0.4);">—</span>';

            let parsed = det;
            if (typeof det === 'string') {
                try {
                    parsed = JSON.parse(det);
                    if (typeof parsed === 'string') parsed = JSON.parse(parsed);
                } catch (e) {
                    return `<span style="font-size:0.83rem; color:#e2e8f0;">${escapeHtml(det)}</span>`;
                }
            }

            if (typeof parsed === 'object' && parsed !== null) {
                if (parsed.path) {
                    const isErr = parsed.status >= 400;
                    const isWarn = parsed.status >= 300 && parsed.status < 400;
                    const statusBg = isErr ? 'rgba(239,68,68,0.15)' : isWarn ? 'rgba(245,158,11,0.15)' : 'rgba(16,185,129,0.15)';
                    const statusColor = isErr ? '#f87171' : isWarn ? '#fbbf24' : '#34d399';
                    const statusBorder = isErr ? 'rgba(239,68,68,0.3)' : isWarn ? 'rgba(245,158,11,0.3)' : 'rgba(16,185,129,0.3)';

                    let html = `<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">`;
                    html += `<code style="font-family:'Inter', monospace; font-weight:700; color:#818cf8; font-size:0.83rem; background:rgba(99,102,241,0.12); border:1px solid rgba(99,102,241,0.25); padding:3px 8px; border-radius:6px;">${escapeHtml(parsed.path)}</code>`;
                    if (parsed.status) {
                        html += `<span style="font-size:0.75rem; font-weight:800; padding:2px 7px; border-radius:6px; background:${statusBg}; color:${statusColor}; border:1px solid ${statusBorder};">${parsed.status}</span>`;
                    }
                    if (parsed.query) {
                        html += `<span style="font-size:0.75rem; color:rgba(255,255,255,0.45); font-family:monospace;">?${escapeHtml(parsed.query)}</span>`;
                    }
                    html += `</div>`;
                    return html;
                }

                const pairs = Object.entries(parsed).map(([k, v]) => {
                    const valStr = typeof v === 'object' ? JSON.stringify(v) : String(v);
                    return `<span style="display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); font-size:0.76rem; color:rgba(255,255,255,0.9);"><span style="color:rgba(255,255,255,0.45); font-weight:600;">${escapeHtml(k)}:</span> <strong>${escapeHtml(valStr)}</strong></span>`;
                }).join(' ');

                return `<div style="display:flex; gap:6px; flex-wrap:wrap;">${pairs}</div>`;
            }

            return `<span style="font-size:0.83rem; color:#e2e8f0;">${escapeHtml(String(parsed))}</span>`;
        }

        function renderTable(logs) {
            const tbody = document.getElementById('logs-table-body');
            if (!logs || logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:48px; color:rgba(255,255,255,0.45);">
                    <div style="font-size:2rem; margin-bottom:8px; opacity:0.4;"><i class="fa-solid fa-list-check"></i></div>
                    <div>No audit log entries found.</div>
                </td></tr>`;
                return;
            }
            tbody.innerHTML = logs.map(log => {
                const dt = new Date(log.created_at);
                const date = dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
                const time = dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                const formattedDetails = formatAuditDetails(log.details, log);
                const tooltipText = typeof log.details === 'object' ? JSON.stringify(log.details, null, 2) : String(log.details || '');

                return `<tr>
                    <td style="vertical-align:middle; white-space:nowrap;">
                        <div style="font-size:0.88rem; font-weight:700; color:#f8fafc;">${date}</div>
                        <div style="font-size:0.75rem; color:rgba(255,255,255,0.45); font-family:'Inter', monospace; margin-top:2px;">${time}</div>
                    </td>
                    <td style="vertical-align:middle; white-space:nowrap;">
                        ${roleBadge(log.user_type)}
                    </td>
                    <td style="vertical-align:middle; white-space:nowrap;">${actionBadge(log.action)}</td>
                    <td style="vertical-align:middle; white-space:nowrap;">${resourceBadge(log.resource_type)}</td>
                    <td style="vertical-align:middle;" title="${escapeHtml(tooltipText)}">
                        ${formattedDetails}
                    </td>
                </tr>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchLogs);
    </script>
</body>
</html>
